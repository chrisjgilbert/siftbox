en:
  activerecord:
    attributes:
      blog:
        # So a refusal reads "Feed address is not a feed" rather than "Feed
        # url ...", which is what Rails humanises the column to. The messages
        # below are written to follow this, and it is the form's own label.
        feed_url: Feed address
    errors:
      models:
        blog:
          attributes:
            feed_url:
              aggregator: looks like a link aggregator. Siftbox reads blogs — feeds
                whose items carry the writing itself rather than a link to it.
              empty: has nothing in it yet. A feed with no items is one siftbox cannot
                tell apart from a page that is not a feed at all.
              unreachable: could not be read. The address may be wrong, or the server
                may be refusing us.
              unreadable: is not a feed. Check the address points at the feed rather
                than at the page it belongs to.
        edition:
          attributes:
            stories:
              duplicate_position: claim the same position twice.
        edition/citation:
          attributes:
            base:
              one_source: must name either a newsletter or a blog post, not both.
        edition/story:
          attributes:
            citations:
              duplicate_blog_post: name the same blog post twice.
              duplicate_newsletter: name the same newsletter twice.
  application:
    masthead:
      archive: Archive
      originals: Originals
      settings: Settings
      subscriptions: Subscriptions
  blogs:
    count:
      one: 1 post
      other: "%{count} posts"
    kind: Blog
    no_image: No image in post
    row:
      confirm: Remove %{name}? Its posts go too, and so do the citations in
        published editions that name them.
      remove: Remove
      remove_blog: Remove %{name}
    section:
      empty: No blogs yet. Paste a feed address above and siftbox will read it
        every hour.
      heading: Blogs
      label: Feed address
      note: The feed address, or the blog's home page — siftbox will find the feed
        from it. Read hourly; new posts go in the archive and the next edition.
      placeholder: https://example.dev
      submit: Follow
    state:
      failing: Not answering for %{duration}
      polled: Checked %{duration} ago
      unpolled: Not checked yet
    too_many: That is a lot of feeds at once. Try again in a minute.
  date:
    formats:
      edition_masthead: "%A %-d %B"
      feed_group: "%A %-d %B"
  editions:
    index:
      count:
        one: 1 edition
        other: "%{count} editions"
      empty: No editions yet. The first one is written at 07:00, from whatever has
        arrived by then.
      line: Archive
      order: By the day covered
    masthead: "%{number} · %{date}"
    number: No. %{number}
    sections:
      briefly: Briefly
      lead: Lead stories
      reading_list: The reading list
    story:
      sources:
        one: Source
        other: Sources
  feed:
    groups:
      earlier: Earlier
      this_week: This week
      today: Today
      yesterday: Yesterday
  layouts:
    application:
      title: siftbox
      wordmark: siftbox
  newsletters:
    age: "%{duration} ago"
    index:
      empty: Nothing yet. Point a subscription at %{address} and it will show up here.
      end_of_feed:
        one: End of feed — 1 item
        other: End of feed — %{count} items
      line: Originals
      no_image: No image in email
      no_image_compact: No image
      subscribe: Subscribe with %{address}
    original:
      back: Back to the archive
      caption: Original HTML, sandboxed in an iframe. Styling is the sender's.
      pen:
        back: Back to subscriptions
        done: Done
        release: This is a newsletter
    unknown_sender: Unknown sender
  passwords:
    edit:
      confirmation: Repeat new password
      password: New password
      submit: Save
      title: Update your password
    new:
      email: Email address
      submit: Email reset instructions
      title: Forgot your password?
  sessions:
    new:
      email: Email address
      forgot: Forgot your password?
      password: Password
      submit: Sign in
      title: Sign in
  settings:
    show:
      inbound_address:
        heading: Inbound address
        note: Point every subscription here. Nothing else lands in this feed.
      line: Settings
  subscriptions:
    badge:
      line:
        one: 1 subscription awaiting confirmation
        other: "%{count} subscriptions awaiting confirmation"
    index:
      awaiting:
        empty: Nothing waiting. A subscription confirmation is held here the moment
          it arrives, and stays until you deal with it.
        heading: Awaiting confirmation
      bounced:
        empty: Nothing refused in the last %{days} days.
        heading: Recently bounced
      line: Subscriptions
      new_senders:
        empty: No address has written for the first time in the last %{days} days.
        heading: New senders
  time:
    formats:
      row_date: "%-d %b"
      row_day: "%a"
      row_time: "%H:%M"

  waitlist_signups:
    closing:
      body: Siftbox is a side project, built for one person's reading habit. The
        waitlist tells me whether to make it work for more.
      title: Want an address?
    errors:
      email: That does not look like an email address.
    footer:
      built: A side project · built on Rails and Action Mailbox
      wordmark: siftbox
    form:
      honeypot: Leave this field empty
      label: Email
      note: One message when it opens. Nothing else.
      placeholder: you@example.com
      submit: Join the waitlist
    joined:
      label: On the list
      note: You'll get one message when siftbox opens.
      reply: If you want to say what you read, reply to it.
    nav:
      waitlist: Join the waitlist
    new:
      eyebrow: Early access
      page_title: siftbox — your news feed
      standfirst: Siftbox gives your subscriptions a dedicated address and collects
        everything that arrives into one feed. Newest first, grouped by day, stripped
        of the styling that makes newsletters hard to read.
      title: Your news feed
    points:
      address:
        body: Every list gets pointed at one dedicated address. Nothing new lands in
          your work inbox, and there are no forwarding rules to maintain.
        kicker: 01 / One address
        title: Subscribe with siftbox, not with you
      feed:
        body: Newest first, grouped by day. Nothing accumulates into a number you have
          to clear, and nothing gets buried under a receipt.
        kicker: 02 / A feed, not a mailbox
        title: Read what you want, when you want
    shot:
      caption: The feed
      date: Thursday 6 August
      day: Today
      # Fixed sample content. The design handoff asks for a live feed here, but
      # this page is unauthenticated — a live feed would publish the reader's
      # own subjects and senders to anyone who loads it.
      rows:
        - number: "01"
          read: false
          sender: Ruby Weekly
          subject: "#742: Frozen string literals, and a faster CSV parser"
          time: "06:12"
        - number: "02"
          read: false
          sender: Platformer
          subject: The moderation backlog nobody wants to own
          time: "05:40"
        - number: "03"
          read: true
          sender: TLDR
          subject: Postgres 18 beta, Figma's dev mode, and four more links
          time: "04:00"
        - number: "04"
          read: false
          sender: This Week in Rails
          subject: Action Mailbox routing, and a quieter Active Record log
          time: "09:02"
        - number: "05"
          read: true
          sender: The Pragmatic Engineer
          subject: What senior engineers actually spend the day doing
          time: "07:15"
      subcaption: Every subscription, newest first

# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  # The morning edition. The zone is named in the schedule rather than left to
  # config.time_zone, so the reader gets it at seven whatever the offset is
  # doing and however the app's own zone is set later. Production only, and
  # deliberately: the scheduler is what fires this, a development machine
  # composing an edition of its own would cost real money for nobody, and
  # spec/config/recurring_spec.rb is what checks the line rather than a
  # worker running locally.
  compose_edition:
    class: Edition::CompositionJob
    schedule: every day at 7am Europe/London

  # The hourly round of the blog roster. Hourly against a daily edition, so
  # the cadence only decides how stale a post can be when the window closes —
  # an hour is noise against that, and conditional requests mean an unchanged
  # feed answers 304 with no body. Away from the top of the hour, where the
  # cleanup below and everything else a host runs on the hour already are.
  #
  # Production only, for the reason the edition is: the scheduler is what
  # fires this, and a development machine fetching a dozen strangers' feeds
  # on the hour for nobody is a cost with no reader.
  poll_blogs:
    class: Blog::PollJob
    schedule: every hour at minute 20

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

# Name of your application. Used to uniquely configure containers.
#
# Shares a host with other apps, so this name and the volume below both have
# to stay unique on it — they are what keep one app's containers and state
# from colliding with another's.
service: siftbox

# Name of the container image.
image: cjgilbert/siftbox

# Deploy to these servers.
#
# This host needs an egress rule blocking outbound traffic from *this app's*
# container to private, loopback and link-local addresses. Ingest fetches
# newsletter images, so senders choose the URLs this app requests. Scope the
# rule to this container rather than the box: the other apps here did not ask
# for it. Kamal will not install it and nothing in this repository can — see
# "Outbound network" in README.md and docs/deploying.md.
servers:
  web:
    hosts:
      - 46.224.179.132
  # job:
  #   hosts:
  #     - 46.224.179.132
  #   cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Remove this section when using multiple web servers and ensure you terminate SSL at your load balancer.
#
# config.assume_ssl and config.force_ssl are already on in production.rb,
# which is what terminating SSL at a proxy requires.
#
# Behind Cloudflare, three things matter:
#
#   1. SSL/TLS mode must be "Full" or "Full (strict)". "Flexible" makes
#      Cloudflare talk plain HTTP to this app, and force_ssl redirects it
#      straight back — an infinite loop, not an error anyone sees.
#   2. Leave the record DNS-only (grey cloud) for the first deploy so
#      Let's Encrypt can answer its own challenge, then turn proxying on.
#   3. The Postmark webhook is an automated POST from a machine. Cloudflare
#      bot or WAF rules will happily block it, and the only symptom is
#      newsletters quietly never arriving. Add a skip rule for
#      /rails/action_mailbox/ if anything goes missing.
#
# The MX record is unaffected — Cloudflare only proxies A, AAAA and CNAME.
proxy:
  ssl: true
  host: siftbox.co
  app_port: 80
  healthcheck:
    path: /up
    interval: 5
    timeout: 10

# Credentials for your image host.
registry:
  # Docker Hub, which is where the other apps on this host come from too.
  username: cjgilbert

  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    # Decrypts credentials, which carry action_mailbox.ingress_password —
    # what Action Mailbox authenticates the Postmark webhook against — and
    # postmark.smtp_token, which sends password-reset mail. Without this the
    # ingress rejects every delivery and newsletters are lost once Postmark
    # gives up retrying.
    - RAILS_MASTER_KEY

    # What the AI editor authenticates with, read at 07:00 by
    # Edition::CompositionJob and by nothing else in the app. Missing, it is
    # not a boot failure or a broken page: it is one KeyError in the worker
    # log and no edition that morning. The raw value goes in
    # .kamal/secrets-common beside KAMAL_REGISTRY_PASSWORD — do not restate
    # it in .kamal/secrets, for the reason given there.
    - ANTHROPIC_API_KEY
  clear:
    # The address subscriptions are pointed at, shown in the feed header and
    # the empty state. Without it, a deployed siftbox tells the reader to
    # subscribe to example.com.
    #
    # A subdomain, so the MX record that sends mail here does not also claim
    # every address at siftbox.co. Any local part reaches the app —
    # ApplicationMailbox routes all — so this only decides what the reader is
    # told to subscribe with, and it should be what they actually use.
    SIFTBOX_INBOUND_ADDRESS: news@news.siftbox.co

    # The feed groups by calendar day, so this decides where the day breaks.
    SIFTBOX_TIME_ZONE: London

    # The host password-reset links are built against. The app's own host,
    # not the inbound one — it has to match proxy.host above.
    SIFTBOX_HOST: siftbox.co

    # The From address on password-reset mail. Must be a Postmark sender
    # signature, or Postmark rejects the send.
    SIFTBOX_MAIL_FROM: siftbox@siftbox.co

    # Whether / serves the landing page and the waitlist takes signups. Off
    # is the default, for anyone running their own siftbox, so without this
    # the landing page disappears on deploy: a signed-out visitor is sent to
    # sign in and a signup answers 404.
    SIFTBOX_WAITLIST: "true"

    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # No DB_HOST and no db accessory: the databases are SQLite files on the
    # volume below, alongside the Active Storage blobs.

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"


# The whole of this app's state: the SQLite databases and the Active Storage
# blobs. Back this path up and you have backed up siftbox.
volumes:
  - "siftbox_storage:/rails/storage"


# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # Built on the target host, which is amd64 already. The deploy machine is an
  # arm64 Mac, so building locally would go through emulation.
  remote: ssh://root@46.224.179.132

  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: 3.3.6
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Use accessory services (secrets come from .kamal/secrets).
# accessories:
#   db:
#     image: mysql:8.0
#     host: 192.168.0.2
#     # Change to 3306 to expose port to the world instead of just local network.
#     port: "127.0.0.1:3306:3306"
#     env:
#       clear:
#         MYSQL_ROOT_HOST: '%'
#       secret:
#         - MYSQL_ROOT_PASSWORD
#     files:
#       - config/mysql/production.cnf:/etc/mysql/my.cnf
#       - db/production.sql:/docker-entrypoint-initdb.d/setup.sql
#     directories:
#       - data:/var/lib/mysql
#   redis:
#     image: redis:7.0
#     host: 192.168.0.2
#     port: 6379
#     directories:
#       - data:/data

# The committed template. Nothing in this file names one deployment: the host,
# the registry account, the proxy hostname and the SIFTBOX_* values are all
# placeholders, and a deploy run against them reaches nothing.
#
# A deployment puts its own values in config/deploy.production.yml, which is
# gitignored, and deploys with a destination:
#
#   bin/kamal deploy -d production
#
# Kamal deep-merges that file over this one, so it carries only what differs: a
# key it leaves out keeps the value here, a key in both takes its value, and an
# array in both is replaced whole rather than appended to — a destination file
# that names hosts replaces the list below rather than adding to it.
# docs/deploying.md step 4 shows the whole file with placeholders.
#
# Two other things change when a destination is given. Containers and the
# kamal-proxy service are named service-role-destination, so what runs is
# siftbox-web-production rather than siftbox-web. And Kamal reads
# .kamal/secrets-common and .kamal/secrets.production for secrets, and does not
# read .kamal/secrets at all — see the comments in that file.

# Name of your application. Used to uniquely configure containers.
#
# Where the host is shared with other apps, this name and the volume below both
# have to stay unique on it — they are what keep one app's containers and state
# from colliding with another's. Two destinations of this app on one host keep
# their containers apart by the destination suffix, but they share the volume
# below unless it is renamed too.
service: siftbox

# Name of the container image.
#
# A path within the registry rather than a full reference: Kamal prefixes
# registry.server onto it, so naming the registry in both gives you
# ghcr.io/ghcr.io/user/siftbox.
image: your-registry-user/siftbox

# Deploy to these servers.
#
# This host needs an egress rule blocking outbound traffic from *this app's*
# container to private, loopback and link-local addresses. Ingest fetches
# newsletter images, so senders choose the URLs this app requests. Scope the
# rule to this container rather than the box: the other apps there did not ask
# for it. Kamal will not install it and nothing in this repository can — see
# "Outbound network" in docs/operating.md and docs/deploying.md.
servers:
  web:
    hosts:
      - your-host.example.com
  # job:
  #   hosts:
  #     - your-host.example.com
  #   cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Remove this section when using multiple web servers and ensure you terminate SSL at your load balancer.
#
# config.assume_ssl and config.force_ssl are already on in production.rb,
# which is what terminating SSL at a proxy requires.
#
# Behind Cloudflare, three things matter:
#
#   1. SSL/TLS mode must be "Full" or "Full (strict)". "Flexible" makes
#      Cloudflare talk plain HTTP to this app, and force_ssl redirects it
#      straight back — an infinite loop, not an error anyone sees.
#   2. Leave the record DNS-only (grey cloud) for the first deploy so
#      Let's Encrypt can answer its own challenge, then turn proxying on.
#   3. The Postmark webhook is an automated POST from a machine. Cloudflare
#      bot or WAF rules will happily block it, and the only symptom is
#      newsletters quietly never arriving. Add a skip rule for
#      /rails/action_mailbox/ if anything goes missing.
#
# The MX record is unaffected — Cloudflare only proxies A, AAAA and CNAME.
proxy:
  ssl: true
  host: siftbox.example.com
  app_port: 80
  healthcheck:
    path: /up
    interval: 5
    timeout: 10

# Credentials for your image host.
registry:
  # Docker Hub, which is what the image above is a path within. Another
  # registry needs a server: line here as well.
  username: your-registry-user

  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    # What Rails signs cookies and generates password-reset tokens with. Rails
    # reads it from here before it looks anywhere else, and there is nowhere
    # else left to look. A different value from the last deploy's signs the
    # reader out and voids any reset link in flight, so carry the existing one
    # across rather than generating a new one.
    - SECRET_KEY_BASE

    # What Action Mailbox authenticates the Postmark webhook against, and the
    # other half of the password in the webhook URL Postmark posts to. Wrong,
    # it is a 401 on every delivery with nothing in the log to say why, and the
    # newsletters are gone once Postmark gives up retrying.
    - RAILS_INBOUND_EMAIL_PASSWORD

    # The Postmark server token, which sends password-reset mail — the only way
    # back into an app with no sign-up flow. Wrong, the send fails at reset
    # time rather than at deploy time.
    - POSTMARK_SMTP_TOKEN

    # The reader's account, created by db/seeds.rb at the first boot on a fresh
    # volume and never updated after. The address is not a secret, but it is
    # the reader's, and env.secret is what keeps it out of this committed file.
    # Missing, the boot logs "No reader account created" and carries on, and
    # there is no way to sign in.
    - SIFTBOX_READER_EMAIL
    - SIFTBOX_READER_PASSWORD

    # What the AI editor authenticates with, read at 07:00 by
    # Edition::CompositionJob and by nothing else in the app. Missing, it is
    # not a boot failure or a broken page: it is one KeyError in the worker
    # log and no edition that morning. The raw value goes in
    # .kamal/secrets-common beside KAMAL_REGISTRY_PASSWORD — do not restate it
    # in whichever file Kamal merges over that one, for the reason given there.
    - ANTHROPIC_API_KEY

    # The Honeybadger project key, which config/honeybadger.yml no longer
    # carries, so the gem reads it from here. Missing, it is not a boot failure
    # or a broken page: the gem logs "API key is missing" once per report, and
    # the error reaches the container log and nowhere else. Kamal will not let
    # it be missing on a deploy, though — a name in env.secret that is in
    # neither secrets file is a refused deploy rather than a warning.
    - HONEYBADGER_API_KEY
  clear:
    # Every SIFTBOX_* value below is a placeholder, overridden name by name in
    # config/deploy.production.yml.

    # The address subscriptions are pointed at, shown in the feed header and
    # the empty state. Without it, a deployed siftbox tells the reader to
    # subscribe to example.com.
    #
    # A subdomain, so the MX record that sends mail here does not also claim
    # every address at the apex. Any local part reaches the app —
    # ApplicationMailbox routes all — so this only decides what the reader is
    # told to subscribe with, and it should be what they actually use.
    SIFTBOX_INBOUND_ADDRESS: news@news.siftbox.example.com

    # The feed groups by calendar day, so this decides where the day breaks. A
    # real zone rather than a placeholder, because an unknown one raises at
    # boot: a deployment that reads somewhere else overrides it.
    SIFTBOX_TIME_ZONE: London

    # The host password-reset links are built against. The app's own host, not
    # the inbound one — it has to match proxy.host above, and both come from
    # the same destination file, so they are changed together.
    SIFTBOX_HOST: siftbox.example.com

    # The From address on password-reset mail. Must be a Postmark sender
    # signature, or Postmark rejects the send.
    SIFTBOX_MAIL_FROM: siftbox@siftbox.example.com

    # Whether / serves the landing page and the waitlist takes signups. Off
    # here, which is what anyone running their own siftbox wants: a signed-out
    # visitor is sent to sign in and a signup answers 404. The deployment that
    # collects signups turns it on in its destination file.
    SIFTBOX_WAITLIST: "false"

    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # No DB_HOST and no db accessory: the databases are SQLite files on the
    # volume below, alongside the Active Storage blobs.

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
#
# An alias takes a destination like any other command: "bin/kamal console -d
# production".
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"


# The whole of this app's state: the SQLite databases and the Active Storage
# blobs. Back this path up and you have backed up siftbox.
#
# The name is the deployment's rather than the destination's — Kamal passes it
# to Docker as it is written here — so moving a running deployment onto a
# destination leaves the volume where it is and the new containers mount the
# same state.
volumes:
  - "siftbox_storage:/rails/storage"


# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # A deploy machine whose architecture differs from the target's builds
  # through emulation unless builder.remote points at the target. That is one
  # machine's fact rather than this app's, so it belongs in the destination
  # file — see docs/deploying.md step 4.

  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: 3.3.6
  # secrets:
  #   - GITHUB_TOKEN

# Use a different ssh user than root
# ssh:
#   user: app

# Use accessory services (secrets come from .kamal/secrets).
# accessories:
#   db:
#     image: mysql:8.0
#     host: 192.168.0.2
#     # Change to 3306 to expose port to the world instead of just local network.
#     port: "127.0.0.1:3306:3306"
#     env:
#       clear:
#         MYSQL_ROOT_HOST: '%'
#       secret:
#         - MYSQL_ROOT_PASSWORD
#     files:
#       - config/mysql/production.cnf:/etc/mysql/my.cnf
#       - db/production.sql:/docker-entrypoint-initdb.d/setup.sql
#     directories:
#       - data:/var/lib/mysql
#   redis:
#     image: redis:7.0
#     host: 192.168.0.2
#     port: 6379
#     directories:
#       - data:/data
